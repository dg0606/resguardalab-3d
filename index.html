<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResguardaLab, modelo 3D</title>
<style>html,body{margin:0;height:100%;background:#f3ece0;font-family:Georgia,serif;color:#3b2a18;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%}
#p{position:fixed;left:12px;top:12px;background:#fffaf0ee;border:1px solid #c9a36b;border-radius:8px;padding:10px 14px;max-width:260px;font-size:14px}
#p h1{font-size:16px;margin:0 0 6px}#p label{display:block;margin-top:8px}#p input{width:100%}
button{background:#8b5a2b;color:#fff;border:0;border-radius:6px;padding:6px 10px;margin:6px 4px 0 0;cursor:pointer}
#n{margin-top:8px;min-height:18px;font-size:13px;color:#6b4a22}small{color:#7a5a30}</style></head><body>
<canvas id="c"></canvas>
<div id="p"><h1>ResguardaLab, modelo 3D</h1>
<small>Arrastra para girar, rueda o pellizco para acercar, clic derecho para mover.</small>
<label>Puerta: <span id="g">0</span>°<input id="a" type="range" min="0" max="110" value="0"></label>
<button id="b1">Abrir / cerrar</button><button id="b2">Frente</button><button id="b3">Vista isométrica</button>
<div id="n"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const D={"fijas": [["fondo", [-1.5, -1.5, -1.5, 38.5, 0.0, 48.5], "#c9a36b"], ["izquierda", [-1.5, 0.0, -1.5, 0.0, 16.0, 48.5], "#a9824a"], ["derecha", [37.0, 0.0, -1.5, 38.5, 16.0, 48.5], "#a9824a"], ["piso", [0.0, 0.0, -1.5, 37.0, 16.0, 0.0], "#a9824a"], ["techo", [0.0, 0.0, 47.0, 37.0, 16.0, 48.5], "#a9824a"], ["iman", [32.5, 2.0, 46.4, 35.5, 4.0, 47.0], "#222222"], ["desarmador chico mango", [3.1, 0.25, 21.6, 7.1, 2.85, 29.5], "#222222"], ["desarmador chico franja", [3.2, 2.85, 23.0, 4.2, 2.95, 28.5], "#f2c814"], ["desarmador chico punta", [4.85, 0.25, 18.1, 5.35, 0.75, 21.6], "#cfd2d6"], ["tira lugar 1", [0.7, 0.0, 20.2, 9.7, 0.25, 23.0], "#8d9096"], ["tornillo", [1.85, 0.25, 21.15, 2.75, 0.5, 22.05], "#cfd2d6"], ["tornillo", [7.55, 0.25, 21.15, 8.45, 0.5, 22.05], "#cfd2d6"], ["desarmador grande mango", [12.5, 0.25, 22.1, 15.5, 3.05, 33.4], "#222222"], ["desarmador grande detalle", [13.0, 3.05, 30.0, 15.0, 3.15, 33.0], "#e8892b"], ["desarmador grande detalle", [13.1, 3.05, 24.0, 14.9, 3.15, 28.0], "#e8892b"], ["desarmador grande vastago", [13.7, 0.25, 14.3, 14.3, 0.85, 22.1], "#cfd2d6"], ["tira lugar 2", [10.5, 0.0, 20.4, 17.5, 0.25, 22.8], "#8d9096"], ["tornillo", [11.05, 0.25, 21.15, 11.95, 0.5, 22.05], "#cfd2d6"], ["tornillo", [16.05, 0.25, 21.15, 16.95, 0.5, 22.05], "#cfd2d6"], ["pinzas mangos", [19.5, 0.25, 15.2, 25.5, 2.05, 26.0], "#e8892b"], ["pinzas cabeza", [20.9, 0.25, 26.0, 24.1, 1.85, 32.5], "#cfd2d6"], ["bolsa pinzas", [16.5, 2.05, 14.6, 28.5, 2.35, 22.0], "#8d9096"], ["bolsa pinzas fondo", [16.5, 0.0, 14.6, 28.5, 0.25, 22.0], "#8d9096"], ["tornillo", [16.85, 0.25, 17.85, 17.75, 0.5, 18.75], "#cfd2d6"], ["tornillo", [27.25, 0.25, 17.85, 28.15, 0.5, 18.75], "#cfd2d6"], ["llave cuerpo", [30.6, 0.25, 15.8, 32.0, 0.85, 30.3], "#cfd2d6"], ["llave cabeza", [29.7, 0.25, 30.3, 32.9, 0.85, 32.0], "#cfd2d6"], ["tira llave arriba", [27.6, 0.0, 18.15, 35.4, 0.25, 21.25], "#8d9096"], ["tira llave abajo", [27.4, 0.0, 13.25, 35.2, 0.25, 16.55], "#8d9096"], ["tira llave arriba (frente)", [27.5, 0.25, 18.2, 35.1, 0.45, 21.2], "#8d9096"], ["tornillo", [27.85, 0.25, 19.25, 28.75, 0.5, 20.15], "#cfd2d6"], ["tornillo", [33.85, 0.25, 19.25, 34.75, 0.5, 20.15], "#cfd2d6"], ["tornillo", [27.85, 0.25, 14.45, 28.75, 0.5, 15.35], "#cfd2d6"], ["tornillo", [33.85, 0.25, 14.45, 34.75, 0.5, 15.35], "#cfd2d6"], ["cinta amarilla", [31.0, 0.0, 10.0, 34.0, 1.0, 12.0], "#f2c814"]], "puerta": [["puerta", [0.2, 16.0, 0.2, 36.8, 17.5, 46.8], "#c9a36b"], ["lector (exterior)", [13.2, 17.5, 31.5, 19.2, 17.9, 35.5], "#3a6ea5"], ["LED verde", [22.5, 17.5, 26.0, 23.5, 18.0, 27.0], "#2ecc71"], ["LED rojo", [22.5, 17.5, 22.0, 23.5, 18.0, 23.0], "#c0392b"], ["Raspberry Pi (case)", [9.0, 13.0, 21.1, 15.5, 16.0, 30.6], "#222222"], ["placa perforada", [13.1, 15.0, 5.0, 17.6, 16.0, 19.5], "#2f7d4f"], ["tarjeta de relevadores", [19.6, 14.2, 15.2, 27.1, 16.0, 20.7], "#3a6ea5"], ["tira de LEDs", [11.7, 15.2, 36.2, 26.2, 16.0, 38.2], "#f4f4f4"], ["camara", [16.9, 15.0, 28.4, 20.1, 16.0, 31.6], "#222222"], ["cerradura", [31.3, 13.0, 18.5, 36.7, 16.0, 22.6], "#8d9096"], ["sensor de puerta", [32.5, 15.4, 43.8, 35.5, 16.0, 44.8], "#f4f4f4"]], "pivote": [0, 17.5]};
const cv=document.getElementById('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(devicePixelRatio);
const S=new THREE.Scene();S.background=new THREE.Color(0xf3ece0);
const cam=new THREE.PerspectiveCamera(35,1,1,1000);
const ctl=new THREE.OrbitControls(cam,cv);ctl.target.set(18.5,23.5,8);ctl.enableDamping=true;
S.add(new THREE.AmbientLight(0xffffff,.65));
const L=new THREE.DirectionalLight(0xffffff,.7);L.position.set(-40,90,120);S.add(L);
const L2=new THREE.DirectionalLight(0xffffff,.3);L2.position.set(80,30,-60);S.add(L2);
const meshes=[];
function add(par,n,b,col,dz){
 const [x0,y0,z0,x1,y1,z1]=b;
 const m=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,z1-z0,y1-y0),new THREE.MeshLambertMaterial({color:col}));
 m.position.set((x0+x1)/2,(z0+z1)/2,(y0+y1)/2-(dz||0));m.userData.n=n;
 m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0x3a2a16,transparent:true,opacity:.45})));
 par.add(m);meshes.push(m);}
D.fijas.forEach(f=>add(S,f[0],f[1],f[2]));
const door=new THREE.Group();door.position.set(0,0,D.pivote[1]);S.add(door);
D.puerta.forEach(f=>add(door,f[0],f[1],f[2],D.pivote[1]));
function setA(v){door.rotation.y=-v*Math.PI/180;document.getElementById('g').textContent=Math.round(v);document.getElementById('a').value=v;}
const A=document.getElementById('a');A.oninput=()=>setA(+A.value);
let t=null;document.getElementById('b1').onclick=()=>{const to=+A.value>5?0:100;clearInterval(t);t=setInterval(()=>{let v=+A.value;v+=Math.sign(to-v)*4;if(Math.abs(to-v)<4){v=to;clearInterval(t)}setA(v)},16)};
function vista(p){cam.position.set(...p);ctl.target.set(18.5,23.5,8);}
document.getElementById('b2').onclick=()=>vista([18.5,23.5,120]);
document.getElementById('b3').onclick=()=>vista([95,85,105]);
vista([95,85,105]);setA(0);
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();
cv.addEventListener('pointermove',e=>{mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mp,cam);const h=ray.intersectObjects(meshes)[0];document.getElementById('n').textContent=h?h.object.userData.n:'';});
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',rs);rs();
(function f(){requestAnimationFrame(f);ctl.update();R.render(S,cam);})();
</script></body></html>
